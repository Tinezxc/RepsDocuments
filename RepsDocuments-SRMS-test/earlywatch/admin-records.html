<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarlyWatch - Admin · Student Records</title>
  <link rel="stylesheet" href="assets/admin.css">
  <link rel="stylesheet" href="assets/modal.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Admin</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="adminNav"></nav>

    <div class="user-profile">
      <div class="avatar" data-user-initials>SA</div>
      <div class="user-info">
        <div class="user-name" data-user-name>System Administrator</div>
        <div class="user-role" data-user-role>Administrator</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1>Student Records</h1>
      <p class="subtitle">Click a row to view the complete student profile</p>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search by name, ID, course, section, or adviser...">
      </div>

      <div class="filter-group">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Critical</button>
        <button class="filter-btn">High</button>
        <button class="filter-btn">Medium</button>
        <button class="filter-btn">Low</button>
      </div>

      <div class="sort-dropdown">
        <select>
          <option>Sort: Risk Score</option>
          <option>Sort: Course</option>
          <option>Sort: GPA</option>
          <option>Sort: Attendance</option>
          <option>Sort: Name</option>
        </select>
      </div>
    </div>

    <section class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Course · Section</th>
              <th>Risk Level</th>
              <th>GPA</th>
              <th>Attendance</th>
              <th>Missed</th>
              <th>Case Status</th>
              <th>Adviser</th>
            </tr>
          </thead>
          <tbody id="adminRecordsBody"></tbody>
        </table>
      </div>
    </section>

    <div class="table-footer text-muted" style="margin-top:1rem;font-size:.8rem;"></div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    ewGuard("admin");
    ewAdminPaintChrome("records");
    ewInitAdminRecords();
  </script>
</body>
</html>
