<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarlyWatch Student Sign Up</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"
              stroke="#ffffff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </div>
        EarlyWatch
      </div>

      <div class="hero-content">
        <h1>
          Create your<br />
          <span class="highlight">Student</span><br />
          Account
        </h1>
        <p>
          Set up credentials to view your academic status, alerts, and
          recommended actions.
        </p>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="login-container">
        <h2>Create student account</h2>
        <p class="subtitle">Fill in the details below to get started</p>

        <div id="registerError" class="login-error" hidden></div>
        <div id="registerSuccess" class="login-success" hidden></div>

        <form id="registerForm" novalidate>
          <!-- Role is fixed to student -->
          <input type="hidden" id="role" name="role" value="student" />

          <div class="form-group">
            <label for="name">Full name</label>
            <input
              type="text"
              id="name"
              placeholder="Full Name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              placeholder="you@cmdi.edu.ph"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="studentId">
              Student ID
              <span style="color: #6b7280; font-weight: 400"
                >(optional — links to your record)</span
              >
            </label>
            <input type="text" id="studentId" placeholder="2023-10001" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="8 letters"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm">Confirm password</label>
            <input
              type="password"
              id="confirm"
              placeholder="Re-enter password"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="btn-submit" id="registerBtn">
            Create account
          </button>
        </form>

        <p class="auth-switch">
          Already have an account?<a href="index.html">Sign in</a>
        </p>
      </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById("registerForm");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm");
      const studentIdEl = document.getElementById("studentId");
      const errorBox = document.getElementById("registerError");
      const successBox = document.getElementById("registerSuccess");
      const submitBtn = document.getElementById("registerBtn");

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.hidden = false;
        successBox.hidden = true;
      }
      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.hidden = false;
        errorBox.hidden = true;
      }
      function clearMessages() {
        errorBox.hidden = true;
        successBox.hidden = true;
        errorBox.textContent = "";
        successBox.textContent = "";
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        clearMessages();

        const data = {
          role: "student",
          name: nameInput.value.trim(),
          email: emailInput.value.trim(),
          password: passInput.value,
          confirm: confirmInput.value,
          studentId: studentIdEl.value.trim() || null,
        };

        if (!data.name || !data.email || !data.password || !data.confirm) {
          showError("Please fill in all required fields.");
          return;
        }
        if (data.password !== data.confirm) {
          showError("Passwords do not match.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account…";

        setTimeout(async () => {
          const result = await ewRegister(data);

          if (!result.ok) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create account";
            showError(result.errors.join(" "));
            return;
          }

          showSuccess("Account created. Redirecting to sign-in…");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        }, 350);
      });
    </script>
  </body>
</html>
