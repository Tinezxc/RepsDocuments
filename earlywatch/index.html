<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarlyWatch Sign In</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="left-panel">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"
              stroke="#ffffff" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" fill="none" />
          </svg>
        </div>
        EarlyWatch
      </div>

      <div class="hero-content">
        <h1>
          Student Risk<br />
          <span class="highlight">Early Intervention</span><br />
          System
        </h1>
        <p>Monitor academic risk signals early and act before students fall behind.</p>
      </div>

      <div class="demo-accounts">
        <div class="demo-title">Demo Accounts — click to fill</div>
        <button type="button" class="demo-chip" data-email="carl.reyes@cmdi.edu.ph" data-password="adviser123">
          <span class="demo-role adviser">Adviser</span>
          <span class="demo-mail">carl.reyes@cmdi.edu.ph</span>
        </button>
        <button type="button" class="demo-chip" data-email="jovic.lanao@cmdi.edu.ph" data-password="instructor123">
          <span class="demo-role instructor">Instructor</span>
          <span class="demo-mail">jovic.lanao@cmdi.edu.ph</span>
        </button>
        <button type="button" class="demo-chip" data-email="alex.reyes@cmdi.edu.ph" data-password="student123">
          <span class="demo-role student">Student</span>
          <span class="demo-mail">alex.reyes@cmdi.edu.ph</span>
        </button>
      </div>
    </div>

    <div class="right-panel">
      <div class="login-container">
        <h2>Sign in</h2>
        <p class="subtitle">Access your monitoring dashboard</p>

        <div id="loginError" class="login-error" hidden></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="Email" autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
            </div>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
        </form>

        <p class="auth-switch">
          Don't have an account?<a href="register.html">Create one</a>
        </p>
      </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
