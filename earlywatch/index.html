<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarlyWatch Sign In</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"
              stroke="#ffffff" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" fill="none" />
          </svg>
        </div>
        EarlyWatch
      </div>

      <div class="hero-content">
        <h1>
          Student Risk<br />
          <span class="highlight">Early Intervention</span><br />
          System
        </h1>
        <p>Monitor academic risk signals early and act before students fall behind.</p>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="login-container">
        <h2>Sign in</h2>
        <p class="subtitle">Access your monitoring dashboard</p>

        <div id="loginError" class="login-error" hidden></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="Email"
              autocomplete="username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Password"
                autocomplete="current-password" required />
              <button type="button" class="toggle-password" id="togglePassword"
                aria-label="Show password" title="Show password">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-footer">
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-submit" id="submitBtn">Sign in</button>
        </form>

        <p class="auth-switch">
          Don't have an account?<a href="register.html">Create one</a>
        </p>
      </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const errorBox = document.getElementById("loginError");
      const submitBtn = document.getElementById("submitBtn");
      const toggleBtn = document.getElementById("togglePassword");
      const eyeIcon = toggleBtn.querySelector(".eye-icon");
      const eyeOffIcon = toggleBtn.querySelector(".eye-off-icon");

      /* ---- Password visibility toggle ---- */
      toggleBtn.addEventListener("click", function () {
        const isPassword = passInput.type === "password";
        passInput.type = isPassword ? "text" : "password";
        eyeIcon.style.display = isPassword ? "none" : "block";
        eyeOffIcon.style.display = isPassword ? "block" : "none";
        toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
        toggleBtn.setAttribute("title", isPassword ? "Hide password" : "Show password");
      });

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.hidden = false;
      }
      function clearError() {
        errorBox.hidden = true;
        errorBox.textContent = "";
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        clearError();

        const email = emailInput.value.trim();
        const password = passInput.value;

        if (!email || !password) {
          showError("Please enter both your email and password.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";

        setTimeout(async () => {
          const account = await ewLogin(email, password);

          if (account) {
            window.location.href = account.redirect;
          } else {
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign in";
            showError("Invalid email or password. Please try again.");
            passInput.value = "";
            passInput.focus();
          }
        }, 350);
      });
    </script>
  </body>
</html>
