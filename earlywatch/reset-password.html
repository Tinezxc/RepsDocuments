<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EarlyWatch — Reset Password</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="left-panel">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"
                stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      EarlyWatch
    </div>
    <div class="hero-content">
      <h1>Choose a new<br /><span class="highlight">Password</span></h1>
      <p>8–20 characters, at least one letter and one symbol.</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="login-container">
      <h2>Reset password</h2>
      <p class="subtitle">Enter your new password below</p>

      <div id="rpError" class="login-error" hidden></div>
      <div id="rpSuccess" class="login-success" hidden></div>

      <form id="rpForm" novalidate>
        <div class="form-group">
          <label for="rpPw">New password</label>
          <div class="password-wrapper">
            <input type="password" id="rpPw" minlength="8" maxlength="20"
                   placeholder="8–20 characters" required />
            <button type="button" class="pw-toggle" id="rpToggle" aria-label="Show password">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="rpConfirm">Confirm new password</label>
          <input type="password" id="rpConfirm" minlength="8" maxlength="20" required />
        </div>

        <button type="submit" class="btn-submit" id="rpBtn">Reset password</button>
      </form>

      <p class="auth-switch">
        <a href="index.html">Back to sign in</a>
      </p>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";

    const form = document.getElementById("rpForm");
    const pw = document.getElementById("rpPw");
    const cf = document.getElementById("rpConfirm");
    const errBox = document.getElementById("rpError");
    const okBox = document.getElementById("rpSuccess");
    const btn = document.getElementById("rpBtn");
    const toggle = document.getElementById("rpToggle");

    toggle.addEventListener("click", () => {
      const showing = pw.type === "text";
      pw.type = showing ? "password" : "text";
      toggle.style.color = showing ? "#9ba1a6" : "#5570f6";
    });

    if (!token) {
      errBox.textContent = "Missing reset token in URL.";
      errBox.hidden = false;
    }

    function showErr(m){ errBox.textContent=m; errBox.hidden=false; okBox.hidden=true; }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errBox.hidden = true; okBox.hidden = true;

      const p = pw.value;
      const c = cf.value;

      if (p.length < 8)  { showErr("Password must be at least 8 characters."); return; }
      if (p.length > 20) { showErr("Password must not exceed 20 characters."); return; }
      if (!/[A-Za-z]/.test(p)) { showErr("Password must include at least one letter."); return; }
      if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(p)) {
        showErr("Password must include at least one symbol."); return;
      }
      if (p !== c) { showErr("Passwords do not match."); return; }

      btn.disabled = true; btn.textContent = "Resetting…";
      const res = await ewResetPassword(token, p);
      btn.disabled = false; btn.textContent = "Reset password";

      if (!res.ok) { showErr(res.errors.join(" ")); return; }

      okBox.textContent = "Password reset! Redirecting to sign in…";
      okBox.hidden = false;
      setTimeout(() => window.location.replace("index.html"), 1200);
    });
  </script>
</body>
</html>
