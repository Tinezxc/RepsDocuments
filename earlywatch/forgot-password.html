<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EarlyWatch — Forgot Password</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="left-panel">
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"
                stroke="#ffffff" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      EarlyWatch
    </div>
    <div class="hero-content">
      <h1>Reset your<br /><span class="highlight">Password</span><br />Securely</h1>
      <p>Enter your school email and we'll send a reset link.</p>
    </div>
  </div>

  <div class="right-panel">
    <div class="login-container">
      <h2>Forgot password</h2>
      <p class="subtitle">We'll email you a reset link</p>

      <div id="fpError" class="login-error" hidden></div>
      <div id="fpSuccess" class="login-success" hidden></div>

      <form id="fpForm" novalidate>
        <div class="form-group">
          <label for="fpEmail">Email address</label>
          <input type="email" id="fpEmail" placeholder="you@cmdi.edu.ph" required />
        </div>
        <button type="submit" class="btn-submit" id="fpBtn">Send reset link</button>
      </form>

      <p class="auth-switch">
        Remembered it?<a href="index.html">Back to sign in</a>
      </p>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("fpForm");
    const email = document.getElementById("fpEmail");
    const errBox = document.getElementById("fpError");
    const okBox  = document.getElementById("fpSuccess");
    const btn    = document.getElementById("fpBtn");

    function showErr(m){ errBox.textContent=m; errBox.hidden=false; okBox.hidden=true; }
    function showOk(m){ okBox.textContent=m; okBox.hidden=false; errBox.hidden=true; }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      errBox.hidden = true; okBox.hidden = true;

      const value = email.value.trim().toLowerCase();
      if (!value) { showErr("Please enter your email address."); return; }

      btn.disabled = true; btn.textContent = "Sending…";
      const res = await ewForgotPassword(value);
      btn.disabled = false; btn.textContent = "Send reset link";

      if (!res.ok) { showErr(res.errors.join(" ")); return; }

      let msg = res.message || "If that email exists, a reset link has been sent.";
      if (res.demoResetLink) {
        msg += "  Demo link: " + res.demoResetLink;
      }
      showOk(msg);
    });
  </script>
</body>
</html>
