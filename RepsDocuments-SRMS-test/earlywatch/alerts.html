<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarlyWatch - Alerts</title>
  <link rel="stylesheet" href="assets/alerts.css">
  <link rel="stylesheet" href="assets/modal.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Adviser</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="adviser-dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i><span>Dashboard</span></a>
      <a href="student-records.html" class="nav-item"><i data-lucide="users"></i><span>Student Records</span></a>
      <a href="interventions.html" class="nav-item"><i data-lucide="clipboard-list"></i><span>Interventions</span></a>
      <a href="alerts.html" class="nav-item active"><i data-lucide="bell"></i><span>Alerts</span><span class="badge red" id="navAlertCount">7</span></a>
      <a href="adviser-profile.html" class="nav-item">
        <i data-lucide="user-circle"></i><span>My Profile</span>
      </a>
</a>
    </nav>

    <div class="user-profile">
      <div class="avatar" data-user-initials>DM</div>
      <div class="user-info">
        <div class="user-name" data-user-name>Dr. Carl Domenic Reyes</div>
        <div class="user-role" data-user-role>Adviser</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <div>
        <h1>Alerts</h1>
        <p class="subtitle">Automated alerts generated by the risk monitoring system.</p>
      </div>
      <div class="toolbar">
        <div class="tabs-container">
          <button class="tab active" data-tab="unread">Unread (0)</button>
          <button class="tab" data-tab="all">All</button>
          <button class="tab" data-tab="read">Read</button>
        </div>
        <button class="btn-acknowledge-all">Acknowledge all (0)</button>
      </div>
    </header>

    <section class="metrics-grid">
      <div class="metric-card card-critical">
        <div class="metric-value" data-alert-count="critical">0</div>
        <div class="metric-label">Critical</div>
      </div>
      <div class="metric-card card-high">
        <div class="metric-value" data-alert-count="high">0</div>
        <div class="metric-label">High</div>
      </div>
      <div class="metric-card card-medium">
        <div class="metric-value" data-alert-count="medium">0</div>
        <div class="metric-label">Medium</div>
      </div>
      <div class="metric-card card-low">
        <div class="metric-value" data-alert-count="low">0</div>
        <div class="metric-label">Low</div>
      </div>
    </section>

    <div class="alerts-grid" id="alertsList"></div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ewGuard("adviser");
    ewInitAlertsPage();
  </script>
</body>
</html>
