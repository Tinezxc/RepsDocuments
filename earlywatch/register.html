<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EarlyWatch Student Sign Up</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <!-- Left Panel -->
    <div class="left-panel">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 2L2 7l10 5 10-5-10-5zM2 12l10 5 10-5M2 17l10 5 10-5"
              stroke="#ffffff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </svg>
        </div>
        EarlyWatch
      </div>

      <div class="hero-content">
        <h1>
          Create your<br />
          <span class="highlight">Student</span><br />
          Account
        </h1>
        <p>
          Set up credentials to view your academic status, alerts, and
          recommended actions.
        </p>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="login-container">
        <h2>Create student account</h2>
        <p class="subtitle">Fill in the details below to get started</p>

        <div id="registerError" class="login-error" hidden></div>
        <div id="registerSuccess" class="login-success" hidden></div>

        <form id="registerForm" novalidate>
          <!-- Role is fixed to student -->
          <input type="hidden" id="role" name="role" value="student" />

          <div class="form-group">
            <label for="name">Full name</label>
            <input
              type="text"
              id="name"
              placeholder="Full Name"
              autocomplete="name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">
              Email address
              <span style="color: #6b7280; font-weight: 400">
                (must be @cmdi.edu.ph)
              </span>
            </label>
            <input
              type="email"
              id="email"
              placeholder="you@cmdi.edu.ph"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="studentId">
              Student ID
              <span style="color: #6b7280; font-weight: 400"
                >(optional — links to your record)</span
              >
            </label>
            <input type="text" id="studentId" placeholder="2023-10001" />
          </div>

          <div class="form-group">
  <label for="password">
    Password
    <span style="color: #6b7280; font-weight: 400">
      (8–20 characters, must include a letter and a symbol)
    </span>
  </label>
  <div class="password-wrapper">
    <input
      type="password"
      id="password"
      placeholder="e.g. MyPass1!"
      autocomplete="new-password"
      required
      minlength="8"
      maxlength="20"
    />
    <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>
</div>

          <div class="form-group">
            <label for="confirm">Confirm password</label>
            <input
              type="password"
              id="confirm"
              placeholder="Re-enter password"
              autocomplete="new-password"
              required
              maxlength="8"
            />
          </div>

          <button type="submit" class="btn-submit" id="registerBtn">
            Create account
          </button>
        </form>

        <p class="auth-switch">
          Already have an account?<a href="index.html">Sign in</a>
        </p>
      </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById("registerForm");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const confirmInput = document.getElementById("confirm");
      const studentIdEl = document.getElementById("studentId");
      const errorBox = document.getElementById("registerError");
      const successBox = document.getElementById("registerSuccess");
      const submitBtn = document.getElementById("registerBtn");

      /* ---- Validation rules (kept in sync with register.php) ---- */
      const ALLOWED_DOMAIN = "cmdi.edu.ph";
      const SYMBOL_RE      = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/;

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.hidden = false;
        successBox.hidden = true;
      }
      function showSuccess(msg) {
        successBox.textContent = msg;
        successBox.hidden = false;
        errorBox.hidden = true;
      }
      function clearMessages() {
        errorBox.hidden = true;
        successBox.hidden = true;
        errorBox.textContent = "";
        successBox.textContent = "";
      }

      /* Live feedback as the user types an email */
      emailInput.addEventListener("blur", () => {
        const email = emailInput.value.trim().toLowerCase();
        if (!email) return;
        if (!email.endsWith("@" + ALLOWED_DOMAIN)) {
          showError(`Email must end with @${ALLOWED_DOMAIN}.`);
        } else {
          clearMessages();
        }
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        clearMessages();

        const data = {
          role: "student",
          name: nameInput.value.trim(),
          email: emailInput.value.trim().toLowerCase(),
          password: passInput.value,
          confirm: confirmInput.value,
          studentId: studentIdEl.value.trim() || null,
        };

        /* ---- Required fields ---- */
        if (!data.name || !data.email || !data.password || !data.confirm) {
          showError("Please fill in all required fields.");
          return;
        }

        /* ---- Email domain check ---- */
        if (!data.email.endsWith("@" + ALLOWED_DOMAIN)) {
          showError(`Email address must end with @${ALLOWED_DOMAIN}.`);
          return;
        }

        /* ---- Password rules: exactly 8 chars, at least one symbol ---- */
        if (data.password.length !== 8) {
          showError("Password must be exactly 8 characters long.");
          return;
        }
        if (!SYMBOL_RE.test(data.password)) {
          showError(
            "Password must include at least one symbol (e.g. ! @ # $ % ^ & * )."
          );
          return;
        }

        /* ---- Match check ---- */
        if (data.password !== data.confirm) {
          showError("Passwords do not match.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account…";

        setTimeout(async () => {
          const result = await ewRegister(data);

          if (!result.ok) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Create account";
            showError(result.errors.join(" "));
            return;
          }

          showSuccess("Account created. Redirecting to sign-in…");
          setTimeout(() => {
            window.location.href = "index.html";
          }, 1000);
        }, 350);
      });
    </script>
  </body>
</html>
