<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarlyWatch - Student Profile</title>
  <link rel="stylesheet" href="assets/student-records.css">
  <link rel="stylesheet" href="assets/modal.css">
  <link rel="stylesheet" href="assets/student-profile.css">
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Adviser</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="adviser-dashboard.html" class="nav-item"><i data-lucide="layout-grid"></i><span>Dashboard</span></a>
      <a href="student-records.html" class="nav-item active"><i data-lucide="users"></i><span>Student Records</span></a>
      <a href="interventions.html" class="nav-item"><i data-lucide="clipboard-list"></i><span>Interventions</span></a>
      <a href="alerts.html" class="nav-item"><i data-lucide="bell"></i><span>Alerts</span><span class="badge red"
          id="navAlertCount">7</span></a>
    </nav>
    <div class="user-profile">
      <div class="avatar" data-user-initials>DM</div>
      <div class="user-info">
        <div class="user-name" data-user-name>Dr. Carl Domenic Reyes</div>
        <div class="user-role" data-user-role>Adviser</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content" id="profileRoot">
    <div class="text-muted" style="padding:2rem;">Loading student…</div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ewGuard("student");
    ewInitStudentDashboard();
  </script>
</body>

</html>
