<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarlyWatch - Student Records</title>
  <link rel="stylesheet" href="assets/student-records.css">
  <link rel="stylesheet" href="assets/modal.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i data-lucide="layers"></i></div>
      <div>
        <div class="brand-name">EarlyWatch</div>
        <div class="brand-sub">Adviser</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="adviser-dashboard.html" class="nav-item">
        <i data-lucide="layout-grid"></i><span>Dashboard</span>
      </a>
      <a href="student-records.html" class="nav-item active">
        <i data-lucide="users"></i><span>Student Records</span>
      </a>
      <a href="interventions.html" class="nav-item">
        <i data-lucide="clipboard-list"></i><span>Interventions</span>
      </a>
      <a href="alerts.html" class="nav-item">
        <i data-lucide="bell"></i><span>Alerts</span>
        <span class="badge red" id="navAlertCount">0</span>
      </a>
    </nav>

    <div class="user-profile">
      <div class="avatar" data-user-initials>DM</div>
      <div class="user-info">
        <div class="user-name" data-user-name>Dr. Carl Domenic Reyes</div>
        <div class="user-role" data-user-role>Adviser</div>
      </div>
      <button type="button" class="logout-btn" onclick="ewLogout()" title="Logout">
        <i data-lucide="log-out"></i>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1>Student Records</h1>
      <p class="subtitle">Click a row to view full profile</p>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search by name, ID, or course...">
      </div>

      <div class="filter-group">
        <button class="filter-btn active">All</button>
        <button class="filter-btn">Critical</button>
        <button class="filter-btn">High</button>
        <button class="filter-btn">Medium</button>
        <button class="filter-btn">Low</button>
      </div>

      <div class="sort-dropdown">
        <select>
          <option>Sort: Risk Score</option>
          <option>Sort: Course</option>
          <option>Sort: GPA</option>
          <option>Sort: Attendance</option>
          <option>Sort: Name</option>
        </select>
      </div>

      <!-- FIXED: onclick calls ewOpenAddStudent directly -->
      <button type="button"
              onclick="ewOpenAddStudent(event)"
              style="background: var(--color-primary); color:#fff; display:inline-flex;
                     align-items:center; gap:6px; padding:.5rem .9rem;
                     border:none; border-radius:8px; cursor:pointer;
                     font-size:.85rem; font-weight:600;">
        <i data-lucide="user-plus" style="width:15px;height:15px;"></i>
        Add Student
      </button>
    </div>

    <section class="table-card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Course · Section</th>
              <th>Risk Level</th>
              <th>GPA</th>
              <th>Attendance</th>
              <th>Missed</th>
              <th>Case Status</th>
              <th>Adviser</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <div class="table-footer"></div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/db.js"></script>
  <script src="js/risk.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    ewGuard("adviser");
    ewInitRecordsPage();
    (function () {
      const n = EW_DB.alerts.unread().length;
      const badge = document.getElementById("navAlertCount");
      if (badge) badge.textContent = n;
    })();
  </script>
</body>
</html>
